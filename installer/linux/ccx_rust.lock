# The Rust toolchain that builds libfea_faer.a (installer/faer_ccx; the faer solver of ccx_spooles): Rust 1.100.0, x86_64-unknown-linux-gnu, the official
# tarballs of static.rust-lang.org (the dist folder 2026-11-12). The SHA-256 digests are the xz_hash values of the channel manifest of that release
# (https://static.rust-lang.org/dist/2026-11-12/channel-rust-1.100.0.toml); build_ccx.sh checks them and unpacks the components into one prefix in the work
# folder (the rust-installer layout, what install.sh would do). Nothing is installed on the machine and rustup is not used. The linker is the gcc of the
# conda-forge toolchain of ccx_toolchain.lock (glibc 2.28 sysroot).
# rustc -vV of this release: commit-hash 0ef1bc386059596dada8fb65b50425aab2ea637a, commit-date 2026-11-09, LLVM 23.1.5 (build_ccx.sh checks the commit hash).
